<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
    <title>AcademiaHJJ</title>


</head>

<body>
    <main>
    <div class="caixa">
        <div class="container">
            <div>
                <h1>Academia HJJ</h1>
                <h2>formulário de inscrição</h2>
            </div>
            <div>
                <img src="./projetc-2/ChatGPT Image 10 de jun. de 2026, 16_11_28.png" width="200px" alt="">
            </div>
            <div>
                <input type="text" placeholder="Nome completo">
                <input type="text" placeholder="E-mail">
                <input type="number" placeholder="Celular">
                <input type="date" placeholder="Data de nascimento">

                <select name="plano" id="plano">Escolha do plano
                    <option value="">Escolha do plano</option>
                    <option value="Mensal">Mensal</option>
                    <option value="Trimestral">Trimestral</option>
                    <option value="Semestral">Semestral</option>
                    <option value="Anual">Anual</option>
                </select>

                <select name="atividade" id="atividade">
                    <option value="">Escolha da atividade</option>
                    <option value="Academia">Academia</option>
                    <option value="Natação">Natação</option>
                    <option value="Funcional">Funcional</option>
                    <option value="Dança e luta">Dança e luta</option>
                </select>

                <textarea name="observações" id="observações" placeholder="observações"></textarea>

                <fieldset>
                    <legend>Endereço</legend>
                    <input type="Estado" placeholder="Estado">
                    <input type="Cidade" placeholder="Cidade">
                    <input type="bairro" placeholder="Bairro">
                    <input type="rua/avenida" placeholder="Rua/Avenida">
                    <input type="numero" placeholder="Número">
                </fieldset>
            </div>

            <button type="submit" value="Cadastrar">Inscreva-se</button>

        </div>
    </div>
    </main>
</body>

</html>
